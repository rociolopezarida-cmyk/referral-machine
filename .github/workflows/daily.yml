name: daily-referral-crawl
on:
  schedule:
    - cron: "0 6 * * *"   # every day, 06:00 UTC (07:00 Paris in winter), after aitrainer.work refreshes its file (about 05:50 UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mercor listings (a failure here no longer stops the micro1 step)
        continue-on-error: true
        run: python3 mercor_crawl.py
      - name: micro1 listings from aitrainer.work's open data (never raises; writes an ERROR row instead)
        continue-on-error: true
        run: python3 micro1_crawl.py
      - name: hot report
        continue-on-error: true
        run: python3 hot_tracker.py
      - name: publish to WordPress (skipped until the three secrets exist)
        continue-on-error: true
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 wp_publish.py
      - name: commit snapshots
        run: |
          git config user.name "crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add snapshots
          git commit -m "snapshots $(date -u +%F)" || echo "nothing new"
          git push
